name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  calculation-and-ui-contracts:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -B -m unittest discover -s scripts -p 'test_*.py' -v
      - run: python -B examples/build_demo.py --output /tmp/personal-atlas-demo.html
      - name: Install browser test tools
        if: matrix.python == '3.13'
        run: |
          npm install --prefix "$RUNNER_TEMP/atlas-browser" --no-package-lock playwright@1.56.1
          "$RUNNER_TEMP/atlas-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Test real browser interactions
        if: matrix.python == '3.13'
        run: NODE_PATH="$RUNNER_TEMP/atlas-browser/node_modules" node scripts/test_browser.cjs /tmp/personal-atlas-demo.html
