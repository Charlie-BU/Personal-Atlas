<script>
// Only display preferences are persisted. Storage may be unavailable for file URLs.
(function () {
  let mode = 'system';
  try { mode = localStorage.getItem('personal-atlas.theme') || mode; } catch (_) {}
  if (!['system', 'light', 'dark'].includes(mode)) mode = 'system';
  const dark = mode === 'dark' || (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  document.documentElement.dataset.themeMode = mode;
  let language = 'zh-CN';
  try { language = localStorage.getItem('personal-atlas.language') || language; } catch (_) {}
  if (!['zh-CN', 'en'].includes(language)) language = 'zh-CN';
  document.documentElement.dataset.language = language;
  document.documentElement.lang = language;
})();

<style>
:root {

}
:root[data-theme="dark"] {

* { box-sizing: border-box; }

.header-tools { display: flex; align-items: center; gap: 24px; }
.theme-switch { display: flex; background: var(--control); border-radius: 22px; padding: 3px; gap: 2px; border: 1px solid var(--line); }

.workspace { overflow: hidden; --left-width: 270px; --right-width: 310px; display: grid; grid-template-columns: var(--left-width) 6px minmax(0, 1fr) 6px var(--right-width); height: calc(100dvh - 104px); min-height: 600px; }

.result-copy { min-width: 0; }

.color-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.canvas-toolbar { position: absolute; top: 20px; left: 22px; right: 22px; display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; pointer-events: none; }
.canvas-toolbar > * { pointer-events: auto; }
.explore-tools { display: flex; gap: 4px; }
.tool-button { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-width: 34px; height: 34px; padding: 7px 9px; font-size: 11px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel); }
.tool-button[aria-pressed="true"] { color: var(--accent); background: var(--selected); border-color: var(--accent); }
.zoom-group { display: flex; border: 1px solid var(--line); border-radius: 7px; background: var(--panel); overflow: hidden; }
.zoom-group button { width: 35px; height: 34px; display: grid; place-items: center; border-right: 1px solid var(--line); }
.zoom-group button:last-child { border: 0; }
.caption { position: absolute; bottom: 18px; left: 24px; right: 24px; pointer-events: none; font-size: 11px; color: var(--muted); background: var(--canvas); width: fit-content; max-width: calc(100% - 48px); padding: 5px 0; }
.caption strong { font-weight: 500; color: var(--text); font-size: 12px; display: block; }
.caption p { margin: 3px 0 0; }
.timeline { position: absolute; inset: 82px 38px 88px; overflow-y: auto; }
.timeline-heading { font: 500 22px var(--serif); margin: 0 0 22px; }
.timecard { padding: 18px 0 18px 20px; border-left: 1px solid var(--line); position: relative; }

.meta-list { display: grid; gap: 10px; padding: 0 0 22px; border-bottom: 1px solid var(--line); }
.meta-row { display: flex; align-items: flex-start; gap: 9px; font-size: 12px; }

.section-heading { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 25px 0 7px; }

.related-row { padding: 13px 0; border-bottom: 1px solid var(--line); }
.related-button { display: flex; align-items: flex-start; gap: 9px; text-align: left; padding: 0; width: 100%; border-radius: 4px; }
.related-button .color-dot { flex-shrink: 0; margin-top: 8px; }

.domain-legend { display: flex; flex-wrap: wrap; gap: 7px; margin: 22px 0; }

.provenance { border-top: 1px solid var(--line); margin-top: 27px; padding-top: 18px; color: var(--muted); font-size: 10px; }
.provenance p { margin: 5px 0; overflow-wrap: anywhere; }
.notice { color: var(--muted); font-size: 10px; border-top: 1px solid var(--line); padding-top: 15px; margin-top: 18px; }
.muted { color: var(--muted); }
[hidden] { display: none !important; }

  .canvas-toolbar { left: 15px; right: 15px; top: 16px; }

.filter-select { width:100%; min-width:0; display:flex; align-items:center; justify-content:space-between; gap:8px; padding:9px 10px; border:1px solid var(--line); border-radius:9px; background:var(--panel); font-size:12px; text-align:left; }

function select(id) { const node=byId.get(id);if(!node)return;if(node.type==='source')$('kind').value='source';else if($('kind').value&&$('kind').value!==node.type)$('kind').value='';if($('domain').value&&node.id!==$('domain').value&&!(node.domains||[]).includes($('domain').value.slice(7)))$('domain').value='';if($('status').value&&$('status').value!==node.status)$('status').value='';selected=id;renderDetail(node);update();reveal(canvas); }
function renderTimeline() {

function fit(animate=true) {

function resize() {

function draw() {

function world(e) {const rect=canvas.getBoundingClientRect();return{x:(e.clientX-rect.left-width/2-pan.x)/zoom,y:(e.clientY-rect.top-height/2-pan.y)/zoom};}

['search','domain','kind','status','relation'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',()=>{if(id==='relation'&&selected)renderDetail(byId.get(selected));update();reveal(canvas);reveal($('results'));}));

$('zoomIn').onclick=()=>zoomAt(zoom*1.25,width/2,height/2,true);$('zoomOut').onclick=()=>zoomAt(zoom/1.25,width/2,height/2,true);

const narrow=matchMedia('(max-width: 760px)');
