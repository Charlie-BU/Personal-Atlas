<script>
// Only display preferences are persisted. Storage may be unavailable for file URLs.
(function () {
  let mode = 'system';
  try { mode = localStorage.getItem('personal-atlas.theme') || mode; } catch (_) {}
  if (!['system', 'light', 'dark'].includes(mode)) mode = 'system';
  const dark = mode === 'dark' || (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  document.documentElement.dataset.themeMode = mode;
  let language = 'zh-CN';
  try { language = localStorage.getItem('personal-atlas.language') || language; } catch (_) {}
  if (!['zh-CN', 'en'].includes(language)) language = 'zh-CN';
  document.documentElement.dataset.language = language;
  document.documentElement.lang = language;
})();
</script>
<style>
:root {
  color-scheme: light;
  --bg: #fcfbf8; --panel: #fcfbf8; --canvas: #fdfcf9; --text: #252e31;
  --muted: #747b7e; --line: #e6e7df; --control: #f5f5f0; --hover: #efF1e9;
  --accent: #5c7653; --focus: #48643f; --selected: #edf1e7; --label: #38413e;
  --subtle: #919893; --shadow: 0 12px 40px #2736250b; --icon-filter: none;
  --serif: "Songti SC", "STSong", "Noto Serif CJK SC", Georgia, serif;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #171c1b; --panel: #1b201f; --canvas: #171c1b; --text: #e8ece4;
  --muted: #a0aba4; --line: #303a34; --control: #222a25; --hover: #2a342c;
  --accent: #b2c79e; --focus: #c3d8b0; --selected: #2c382b; --label: #d2ddd0;
  --subtle: #829087; --shadow: 0 12px 40px #0002; --icon-filter: invert(1);
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; }
button, input, select, summary { font: inherit; }
button { cursor: pointer; }
button, input, select { color: var(--text); }
button { background: transparent; border: 0; }
a { color: var(--accent); text-underline-offset: 4px; }
button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible, a:focus-visible, [role="region"]:focus-visible, canvas:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
button:hover { background: var(--hover); }
.icon { width: 18px; height: 18px; flex: 0 0 auto; vertical-align: middle; filter: var(--icon-filter); opacity: .7; }
.topbar { min-height: 104px; padding: 18px 28px; display: flex; align-items: center; gap: 30px; border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 16px; flex: 0 0 auto; }
.brand-icon { width: 48px; height: 48px; flex: 0 0 auto; }
.brand-icon .icon { width: 100%; height: 100%; filter:none; opacity:1; object-fit:contain; }
:root[data-theme="dark"] .brand-icon .icon { filter:invert(1); }
h1 { font: 600 27px/1.25 var(--serif); letter-spacing: 1px; margin: 0 0 4px; }
.eyebrow { color: var(--accent); font-size: 10px; letter-spacing: 2.4px; text-transform: uppercase; }
.search-box { display: flex; align-items: center; gap: 10px; background: var(--control); border: 1px solid var(--line); border-radius: 9px; padding: 0 12px; min-width: 160px; flex: 1; max-width: 460px; margin-left: auto; }
.search-box input { background: transparent; border: 0; outline: 0; width: 100%; min-width: 0; padding: 11px 0; font-size: 13px; }
.search-box input:focus-visible { outline: none; }
.filter-option:focus-visible, .calendar button:focus-visible { outline-offset: -2px; }
.search-box input::placeholder { color: var(--muted); }
.search-shortcut { border: 1px solid var(--line); border-radius: 4px; font-size: 10px; padding: 0 4px; white-space: nowrap; color: var(--muted); }
.appearance-tools { display: flex; align-items: center; gap: 8px; }
.language-toggle { flex-shrink: 0; min-width: 44px; height: 40px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 22px; background: var(--control); font-size: 11px; }
:root[lang="en"] .meta-row .meta-label { width: 62px; }

.header-tools { display: flex; align-items: center; gap: 24px; }
.theme-switch { display: flex; background: var(--control); border-radius: 22px; padding: 3px; gap: 2px; border: 1px solid var(--line); }
.theme-switch button { border-radius: 20px; padding: 7px 9px; height: 34px; display: grid; place-items: center; font-size: 11px; }
.theme-switch button[aria-pressed="true"] { background: var(--panel); box-shadow: 0 1px 5px #0001; color: var(--accent); }
.metrics { display: flex; gap: 19px; border-left: 1px solid var(--line); padding-left: 24px; }
.metric { text-align: center; }
.metric strong { display: block; font: 500 23px/1.3 Georgia, serif; font-variant-numeric: tabular-nums; }
.metric span { color: var(--muted); font-size: 11px; }
.workspace { overflow: hidden; --left-width: 270px; --right-width: 310px; display: grid; grid-template-columns: var(--left-width) 6px minmax(0, 1fr) 6px var(--right-width); height: calc(100dvh - 104px); min-height: 600px; }
.sidebar { container-type: inline-size; min-width: 0; overflow-x: hidden; display: flex; flex-direction: column; overflow-y: auto; padding: 22px 18px; border-right: 1px solid var(--line); background: var(--panel); }
.sidebar, .inspector, .results, .related-records { scrollbar-width: none; -ms-overflow-style: none; }
.sidebar::-webkit-scrollbar, .inspector::-webkit-scrollbar, .results::-webkit-scrollbar, .related-records::-webkit-scrollbar { display: none; width: 0; height: 0; }
.splitter { position: relative; z-index: 3; cursor: col-resize; touch-action: none; background: var(--panel); outline-offset: -2px; }
.splitter::after { content: ''; position: absolute; inset: 0 2px; background: var(--line); border-radius: 2px; transition: background-color .18s; }
.splitter:hover::after, .splitter:focus-visible::after, .splitter.dragging::after { background: var(--accent); }
body.resizing { cursor: col-resize; user-select: none; }
.navigation { display: grid; gap: 5px; margin-bottom: 18px; }
.nav-button { display: flex; align-items: center; gap: 12px; padding: 12px 14px; text-align: left; border-radius: 7px; font-weight: 500; border-left: 3px solid transparent; }
.nav-button[aria-pressed="true"] { background: var(--selected); border-left-color: var(--accent); color: var(--accent); }
.sidebar details { border-top: 1px solid var(--line); margin-top: 3px; padding: 18px 0; }
summary { cursor: pointer; list-style: none; display: flex; align-items: center; gap: 9px; font-size: 13px; font-weight: 600; }
summary::-webkit-details-marker { display: none; }
summary .chevron { margin-left: auto; width: 14px; height: 14px; transform: rotate(-90deg); }
details[open] > summary .chevron { transform: none; }
.filter-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 9px; margin: 17px 0 0; }
.filter-field { min-width: 0; }

function matchesQuery(node, query) {

}
function update() {

  const candidates = nodes.filter(n=>matchesQuery(n,q)

  const neighbors=focus&&selected?neighborIds(selected):null;
  visible=candidates.filter(n=>!neighbors||neighbors.has(n.id));
  const ids=new Set(visible.map(n=>n.id));
  const matchesRelation = relationFilter();
  links=data.edges.filter(e=>ids.has(e.from)&&ids.has(e.to)&&matchesRelation(e));
  $('visibleCount').textContent=visible.length+' / '+nodes.length+t(' 个节点 · ')+links.length+' / '+data.edges.length+t(' 条关系');
  $('resultCount').textContent='('+visible.length+')';
  $('results').replaceChildren();
  visible.slice().sort((a,b)=>displayTitle(a).localeCompare(displayTitle(b),language)).forEach(n=>{

    copy.append(el('span',displayTitle(n),'result-title'),el('span',(typeNames[n.type]||n.type)+(n.status?' · '+(statusNames[n.status]||n.status):''),'result-meta'));

function metaRow(target, name, label, value) { const row=el('div',undefined,'meta-row');row.append(icon(name),el('span',label,'meta-label'),el('span',value,'meta-value'));target.append(row); }
function timeText(n) {const temporal=n.temporal||{};if(temporal.mode==='none')return t('无时间信息');if(temporal.mode==='point')return temporal.at||t('时间未知');return (temporal.start||t('开始时间未知'))+' → '+(temporal.end||t('结束时间未记录'));}

function select(id, remember=true) {
  const node = byId.get(id);

  if(node.type==='source'&&!kinds.includes('source')) setFilter('kind',[...kinds,'source']);
  else if(kinds.length&&!kinds.includes(node.type)) setFilter('kind');
  if(domains.length&&!domains.some(domain=>id===domain||(node.domains||[]).includes(domain.slice(7)))) setFilter('domain');
  if(statuses.length&&!statuses.includes(node.status)) setFilter('status');
  if(!matchesDates(node)) dateRange.start = dateRange.end = '';
  const query = $('search').value.trim().toLocaleLowerCase();
  if(!matchesQuery(node,query)) $('search').value = '';

$('previousNode').onclick = ()=>{
  if(nodeHistory.at(-1)===selected) nodeHistory.pop();

};

function renderTimeline() {
  const list=$('timeline');list.replaceChildren(el('h2',t('经历的时间线'),'timeline-heading'));
  const rank=new Map(data.timeline.map((id,i)=>[id,i]));
  const timed=visible.filter(n=>n.temporal&&n.temporal.mode!=='none').sort((a,b)=>rank.get(a.id)-rank.get(b.id));
  timed.forEach(n=>{const card=el('div',undefined,'timecard'),button=el('button',n.title);button.onclick=()=>select(n.id);card.append(el('small',timeText(n)),button,el('p',n.summary||''));list.append(card);});
  if(!timed.length)list.append(el('p',t('当前范围没有带时间的记录。'),'muted'));

function fit(animate=true) {
  if(!visible.length||!width||!height)return;
  const xs=visible.map(n=>n.x),ys=visible.map(n=>n.y),minx=Math.min(...xs),maxx=Math.max(...xs),miny=Math.min(...ys),maxy=Math.max(...ys);
  const nextZoom=Math.min(1.6,Math.max(.05,Math.min((width-130)/(maxx-minx+65),(height-180)/(maxy-miny+65))));
  cameraTo(nextZoom,{x:-(maxx+minx)/2*nextZoom-12,y:-(maxy+miny)/2*nextZoom+5},animate);
}
function resize() {
  const rect=canvas.getBoundingClientRect();if(!rect.width||!rect.height)return;
  const changed=width!==rect.width||height!==rect.height;width=rect.width;height=rect.height;
  canvas.width=width*devicePixelRatio;canvas.height=height*devicePixelRatio;
  ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);if(changed)fit(false);else draw();

function draw() {
  ctx.clearRect(0,0,width,height);ctx.save();ctx.translate(width/2+pan.x,height/2+pan.y);ctx.scale(zoom,zoom);

  });

    const text = source ? (highlighted?sourceTitle(node):sourceDay(node)||t('日期未知')) : displayTitle(node);

function world(e) {const rect=canvas.getBoundingClientRect();return{x:(e.clientX-rect.left-width/2-pan.x)/zoom,y:(e.clientY-rect.top-height/2-pan.y)/zoom};}
